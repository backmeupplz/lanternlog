[package]
name = "tugpress"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "One small server for many blogs on many domains, built for search engines and AI answers"
repository = "https://github.com/backmeupplz/tugpress"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
flate2 = "1"
maud = "0.27"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
